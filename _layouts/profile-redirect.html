<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url={{ '/about/' | relative_url }}">
    <link rel="canonical" href="{{ '/about/' | absolute_url }}">
    <title>Page moved | {{ site.title | escape }}</title>
    <script>
      var destination = window.location.hash === '#publications'
        ? {{ '/#publications' | relative_url | jsonify }}
        : {{ '/about/' | relative_url | jsonify }};
      window.location.replace(destination);
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="{{ '/about/' | relative_url }}">About</a>. Research is listed under <a href="{{ '/#publications' | relative_url }}">Papers &amp; publications</a>.</p>
  </body>
</html>
